version: '3.8'

services:
  scraper-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uk_price_comparison_scraper
    restart: unless-stopped
    ports:
      - "4000:4000"
    shm_size: '2gb'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - scraper_sessions:/app/sessions
      - scraper_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  scraper_sessions:
    driver: local
  scraper_logs:
    driver: local
